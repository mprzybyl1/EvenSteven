<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#3AA6D0" />
    <meta name="description" content="EvenSteven — dziel koszty wyjazdu po równo (albo i nie)" />
    <title>EvenSteven</title>
    <script>
      // Ustaw motyw zanim strona się wyrenderuje (brak mignięcia jasnym).
      (function () {
        try {
          var t = localStorage.getItem("es-theme") || "system";
          var dark = t === "dark" || (t === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
          if (dark) document.documentElement.classList.add("dark");
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
